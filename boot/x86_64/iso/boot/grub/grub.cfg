set timeout=0
set default=0
set gfxmode=auto
set gfxpayload=keep

# Load the appropriate video backend for either BIOS or EFI.
insmod all_video

# A standalone EFI GRUB initially runs from its embedded memdisk.  Switch the
# root to the El Torito ISO before resolving the kernel and rootfs paths.
search --file --set=root /boot/kernel.bin

menuentry "TOS" {
	multiboot2 /boot/kernel.bin
	module2 /boot/disk.img "rootfs"
	boot
}
